<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="دورة حياة النحلة في أربع مراحل">
  <defs>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b47710"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="328" rx="24" fill="#fffaf0" stroke="#e6b63f" stroke-width="2"/>
  <text x="600" y="44" text-anchor="middle" font-family="Tajawal, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#8a5906">دورة حياة النحلة — أربع مراحل متكاملة</text>

  <line x1="286" y1="163" x2="318" y2="163" stroke="#b47710" stroke-width="3" marker-end="url(#arrowGold)"/>
  <line x1="571" y1="163" x2="603" y2="163" stroke="#b47710" stroke-width="3" marker-end="url(#arrowGold)"/>
  <line x1="856" y1="163" x2="888" y2="163" stroke="#b47710" stroke-width="3" marker-end="url(#arrowGold)"/>

  <!-- Stage 1: Egg -->
  <g>
    <rect x="40" y="72" width="240" height="190" rx="20" fill="#fff6e2" stroke="#e6b63f"/>
    <circle cx="160" cy="128" r="36" fill="#ffffff" stroke="#b47710" stroke-width="2"/>
    <ellipse cx="160" cy="128" rx="9" ry="13" fill="#ffffff" stroke="#8a5906" stroke-width="2.5"/>
    <path d="M151 116 q9 -6 18 0" fill="none" stroke="#b47710" stroke-width="1.5"/>
    <text x="160" y="204" text-anchor="middle" font-family="Tajawal, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#241f12">البيضة</text>
    <text x="160" y="232" text-anchor="middle" font-family="Tajawal, Segoe UI, sans-serif" font-size="15" fill="#7d745d">تضعها الملكة في العين الشمعية</text>
  </g>

  <!-- Stage 2: Larva -->
  <g>
    <rect x="325" y="72" width="240" height="190" rx="20" fill="#fff6e2" stroke="#e6b63f"/>
    <circle cx="445" cy="128" r="36" fill="#ffffff" stroke="#b47710" stroke-width="2"/>
    <path d="M431 137 C427 117 455 111 461 124 C466 136 448 145 435 139 Z" fill="#f6d274" stroke="#8a5906" stroke-width="2"/>
    <path d="M436 121 l6 3 M443 118 l6 3 M450 120 l6 4" stroke="#b47710" stroke-width="1.5" stroke-linecap="round"/>
    <text x="445" y="204" text-anchor="middle" font-family="Tajawal, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#241f12">اليرقة</text>
    <text x="445" y="232" text-anchor="middle" font-family="Tajawal, Segoe UI, sans-serif" font-size="15" fill="#7d745d">تتغذى وتنمو وتعتني بها العاملات</text>
  </g>

  <!-- Stage 3: Pupa -->
  <g>
    <rect x="610" y="72" width="240" height="190" rx="20" fill="#fff6e2" stroke="#e6b63f"/>
    <circle cx="730" cy="128" r="36" fill="#ffffff" stroke="#b47710" stroke-width="2"/>
    <ellipse cx="730" cy="129" rx="13" ry="18" fill="#f6d274" stroke="#8a5906" stroke-width="2"/>
    <path d="M718 122 q12 5 24 0 M717 130 q13 6 26 0 M719 138 q11 5 22 0" fill="none" stroke="#b47710" stroke-width="1.4"/>
    <text x="730" y="204" text-anchor="middle" font-family="Tajawal, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#241f12">العذراء</text>
    <text x="730" y="232" text-anchor="middle" font-family="Tajawal, Segoe UI, sans-serif" font-size="15" fill="#7d745d">تتطور أعضاء الجسم داخل العين المغلقة</text>
  </g>

  <!-- Stage 4: Adult -->
  <g>
    <rect x="895" y="72" width="240" height="190" rx="20" fill="#fff6e2" stroke="#e6b63f"/>
    <circle cx="1015" cy="128" r="36" fill="#ffffff" stroke="#b47710" stroke-width="2"/>
    <ellipse cx="1006" cy="118" rx="10" ry="6" transform="rotate(-28 1006 118)" fill="#ffffff" stroke="#8a5906" stroke-width="1.4"/>
    <ellipse cx="1024" cy="118" rx="10" ry="6" transform="rotate(28 1024 118)" fill="#ffffff" stroke="#8a5906" stroke-width="1.4"/>
    <ellipse cx="1015" cy="133" rx="14" ry="10" fill="#e6b63f" stroke="#8a5906" stroke-width="2"/>
    <path d="M1009 125 v16 M1015 124 v18 M1021 125 v16" stroke="#8a5906" stroke-width="2"/>
    <circle cx="1030" cy="130" r="6" fill="#8a5906"/>
    <text x="1015" y="204" text-anchor="middle" font-family="Tajawal, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#241f12">النحلة البالغة</text>
    <text x="1015" y="232" text-anchor="middle" font-family="Tajawal, Segoe UI, sans-serif" font-size="15" fill="#7d745d">تخرج مكتملة النمو لتبدأ العمل</text>
  </g>
</svg>
